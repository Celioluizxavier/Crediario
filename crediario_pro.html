<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crediário Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--bg:#f4f6fa;--cd:#fff;--tx:#1d2433;--mu:#6b7488;--pr:#2563eb;--ok:#16a34a;--er:#dc2626;--wn:#d97706;--bd:#e2e6ee}
[data-t=dark]{--bg:#0f1420;--cd:#1a2132;--tx:#e8ecf5;--mu:#93a0b8;--bd:#2a3347}
*{box-sizing:border-box}body{margin:0;font:14px Inter,Roboto,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--cd);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
header b{font-size:17px;margin-right:12px}nav button{background:none;color:var(--tx);border:0;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600}nav button.on{background:var(--pr);color:#fff}
main{max-width:1100px;margin:16px auto;padding:0 12px}.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px #0000000d}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.k{font-size:22px;font-weight:700}.mu{color:var(--mu)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
button.b{background:var(--pr);color:#fff;border:0;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;margin:2px}button.b.s{background:var(--mu)}button.b.ok{background:var(--ok)}button.b.er{background:var(--er)}
table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid var(--bd);text-align:left}.r{text-align:right}
.bd{padding:2px 9px;border-radius:99px;color:#fff;font-size:12px;font-weight:700}.bd.ok{background:var(--ok)}.bd.wn{background:var(--wn)}.bd.er{background:var(--er)}
.bar{height:14px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:20;padding:10px}#modal>div{background:var(--cd);border-radius:14px;padding:18px;max-width:640px;width:100%;max-height:92vh;overflow:auto}
.alert{background:#fef3c7;color:#78350f;padding:10px;border-radius:8px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:130px}
.cartao{width:320px;height:190px;border-radius:14px;background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:14px;margin:6px auto;display:flex;flex-direction:column;justify-content:space-between}.cartao svg{background:#fff;border-radius:6px;max-width:100%}.verso{background:#fff;color:#111;align-items:center;border:1px solid #ccc}
svg.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}nav button,button.b{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.sg{border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-top:6px}.sg div{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--bd);background:var(--cd)}.sg div:hover{background:var(--bg)}
#prt{display:none}@media print{body>*:not(#prt){display:none!important}#prt{display:block}}
</style></head><body data-t="light">
<header><b id="logo"></b><nav id="nav"></nav><span style="flex:1"></span><span id="st" class="bd wn">verificando…</span><button class="b s" id="tbtn" onclick="tema()"></button></header>
<main id="main"></main><div id="modal"></div><div id="prt"></div>
<script>
/* ===== UTIL ===== */
const IC={card:'<rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/>',moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',chart:'<path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/>',cart:'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 2h2l2.7 12.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6L22 7H5.1"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',box:'<path d="M21 8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',wallet:'<rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8M12 17.5v-11"/>',cam:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',print:'<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/>',down:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',warn:'<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4M12 17h.01"/>',lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',ok:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',clip:'<path d="m21.4 11-9.2 9.2a6 6 0 0 1-8.5-8.5l8.6-8.6a4 4 0 1 1 5.6 5.7l-8.6 8.5a2 2 0 0 1-2.8-2.8l8.5-8.5"/>',msg:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',edit:'<path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',plus:'<path d="M5 12h14M12 5v14"/>'};const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const $=s=>document.querySelector(s),R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date()),hhmm=()=>new Date().toTimeString().slice(0,8),dBR=d=>d?d.split('-').reverse().join('/'):'';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),r2=v=>Math.round(v*100)/100;
const dig=s=>String(s||'').replace(/\D/g,'');
function mCPF(v){v=dig(v).slice(0,11);return v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')}
function mTel(v){v=dig(v).slice(0,11);return v.length>10?v.replace(/(\d\d)(\d{5})(\d{4})/,'($1) $2-$3'):v.replace(/(\d\d)(\d{4})(\d{0,4})/,'($1) $2-$3')}
function okCPF(c){c=dig(c);if(c.length!=11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=c[i]*(t+1-i);if((s*10%11)%10!=c[t])return false}return true}
function beep(f=880,d=.12){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
/* ===== BANCO (IndexedDB) ===== */
let db;const ST=['config','clientes','produtos','itens','pagamentos','lembretes','logs'];
const abrir=()=>new Promise((ok,er)=>{const r=indexedDB.open('crediario_pro',1);r.onupgradeneeded=()=>ST.forEach(s=>r.result.createObjectStore(s,{keyPath:'id'}));r.onsuccess=()=>{db=r.result;ok()};r.onerror=er});
const tx=(s,m,f)=>new Promise((ok,er)=>{const t=db.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>ok(q&&q.result);t.onerror=er});
const getAll=s=>tx(s,'readonly',o=>o.getAll()),put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),del=(s,id)=>tx(s,'readwrite',o=>o.delete(id)),clr=s=>tx(s,'readwrite',o=>o.clear());
let D={cfg:{},cli:[],prod:[],itens:[],pag:[],lem:[]};
async function load(){const c=await getAll('config');D.cfg=c.find(x=>x.id=='loja')||{id:'loja'};D.cli=await getAll('clientes');D.prod=await getAll('produtos');D.itens=await getAll('itens');D.pag=await getAll('pagamentos');D.lem=await getAll('lembretes')}
const log=(a)=>put('logs',{id:uid(),ts:Date.now(),acao:a});
/* ===== REGRAS ===== */
const cli=id=>D.cli.find(c=>c.id===id);
function venc(it,c){const[y,m,d]=it.data.split('-').map(Number),v=Math.min(+c.venc||10,28);return iso(v<=d?new Date(y,m,v):new Date(y,m-1,v))}
function atraso(it,c){return Math.floor((new Date(today()+'T00:00')-new Date(venc(it,c)+'T00:00'))/864e5)}
function juros(it,c){return it.tipo=='item'&&it.status=='ABERTO'&&c.aplicaJuros!==false&&atraso(it,c)>0?r2(it.valor*(+c.juros||0)/100):0}
const custo=(it,c)=>it.valor+juros(it,c);
const itensC=id=>D.itens.filter(i=>i.cid===id).sort((a,b)=>a.ts-b.ts);
const abertos=id=>itensC(id).filter(i=>i.tipo=='item'&&i.status=='ABERTO');
function saldo(id){const c=cli(id);return r2(itensC(id).filter(i=>i.tipo=='abat'||i.status=='ABERTO').reduce((s,i)=>s+i.valor+(i.tipo=='item'?juros(i,c):0),0))}
function vencido(id){const c=cli(id);return r2(abertos(id).filter(i=>atraso(i,c)>0).reduce((s,i)=>s+custo(i,c),0))}
function maxAtraso(id){const c=cli(id);return Math.max(0,...abertos(id).map(i=>atraso(i,c)))}
function pont(id){const c=cli(id),a=maxAtraso(id);if(a>30)return['Inadimplente','er'];if(a>0)return['Atenção','wn'];
 const p=itensC(id).filter(i=>i.status=='PAGO'&&i.tipo=='item');if(p.length>4&&p.filter(i=>i.pagoEm>venc(i,c)).length/p.length>.3)return['Atenção','wn'];return['Pontual','ok']}
function top10(id){const m={};itensC(id).filter(i=>i.tipo=='item').forEach(i=>m[i.nome]=(m[i.nome]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10)}
/* Baixa FIFO: mais antigo primeiro; se não couber, procura o próximo que caiba; sobra vira abatimento */
async function pagar(cid,valor,data,forma,comp){const c=cli(cid),pid=uid();let rest=r2(valor),n=0;
 for(;;){const it=abertos(cid).find(i=>custo(i,c)<=rest+.001);if(!it)break;const j=juros(it,c);rest=r2(rest-it.valor-j);it.status='PAGO';it.pagoEm=data;it.pagId=pid;it.jurosPagos=j;await put('itens',it);D.itens=D.itens;n++}
 if(rest>.004)await put('itens',{id:uid(),cid,tipo:'abat',data,hora:hhmm(),quem:'',nome:'ABATIMENTO PARCIAL (Crédito Abatido)',valor:-rest,status:'PAGO',pagoEm:data,ts:Date.now(),pagId:pid}),n++;
 await put('pagamentos',{id:pid,cid,valor,data,forma,comp,ts:Date.now()});await log(`Pagamento ${R(valor)} de ${c.nome}`);await load()}
/* ===== UI BASE ===== */
const TABS={dash:ic('chart')+' Painel',pdv:ic('cart')+' Caixa',cli:ic('users')+' Clientes',prod:ic('box')+' Produtos',agenda:ic('bell')+' Agenda',cfg:ic('gear')+' Config'};let tab='dash',V={};
function go(t){tab=t;$('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k==t?'on':''}" onclick="go('${k}')">${v}</button>`).join('');VW[t]()}
const M=h=>{$('#modal').innerHTML=`<div>${h}</div>`;$('#modal').style.display='flex'},X=()=>{$('#modal').style.display='none';$('#modal').innerHTML=''};
function tema(){const t=document.body.dataset.t=='dark'?'light':'dark';document.body.dataset.t=t;try{localStorage.setItem('tema',t)}catch(e){}}
const badge=id=>{const[t,k]=pont(id);return`<span class="bd ${k}">${t}</span>`};
/* ===== PAINEL ===== */
const VW={};
VW.dash=()=>{const mes=today().slice(0,7);let rua=0,venc_=0,inad=[];D.cli.forEach(c=>{const s=saldo(c.id);rua+=Math.max(0,s);venc_+=vencido(c.id);if(pont(c.id)[1]=='er')inad.push(c)});
 const rec=D.pag.filter(p=>p.data.startsWith(mes)).reduce((s,p)=>s+p.valor,0),tops=D.cli.map(c=>[c,saldo(c.id)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,8);
 const dias=D.cfg.lastBackup?Math.floor((Date.now()-D.cfg.lastBackup)/864e5):999;
 $('#main').innerHTML=`${dias>7&&D.cli.length?`<div class="alert">${ic('warn')} ${D.cfg.lastBackup?'Faz '+dias+' dias':'Nunca foi feito backup'}. <button class="b" onclick="backupExp()">Exportar backup agora</button></div>`:''}
 <div class="g"><div class="card"><div class="mu">A receber na rua</div><div class="k">${R(rua)}</div></div><div class="card"><div class="mu">Vencido em atraso</div><div class="k" style="color:var(--er)">${R(venc_)}</div></div><div class="card"><div class="mu">Recebido no mês</div><div class="k" style="color:var(--ok)">${R(rec)}</div></div><div class="card"><div class="mu">Clientes inadimplentes</div><div class="k">${inad.length}</div></div></div>
 <div class="card"><h3>Top devedores</h3><table>${tops.map(([c,s])=>`<tr><td><a href="#" onclick="verCli('${c.id}');return false">${esc(c.nome)}</a></td><td>${badge(c.id)}</td><td class="r">${R(s)}</td></tr>`).join('')||'<tr><td class="mu">Sem débitos.</td></tr>'}</table></div>`};
/* ===== CLIENTES ===== */
VW.cli=()=>{$('#main').innerHTML=`<div class="card row"><input id="q" placeholder="Buscar nome, CPF ou telefone" oninput="listCli()"><button class="b" style="flex:0" onclick="formCli()">${ic('plus')} Novo cliente</button></div><div class="card" id="lc"></div>`;listCli()};
function achar(q){q=q.trim().toLowerCase();if(!q)return D.cli;const d=dig(q);return D.cli.filter(c=>c.id.toLowerCase()==q||c.nome.toLowerCase().includes(q)||(d&&(dig(c.cpf).includes(d)||dig(c.tel).includes(d))))}
function listCli(){$('#lc').innerHTML='<table>'+achar($('#q').value).map(c=>`<tr style="cursor:pointer" onclick="verCli('${c.id}')"><td>${esc(c.nome)}<br><small class="mu">${c.id}</small></td><td>${badge(c.id)}</td><td class="r">${R(saldo(c.id))}</td></tr>`).join('')+'</table>'}
function formCli(id){const c=id?cli(id):{limite:500,venc:10,juros:2,forma:'Dinheiro'};
 M(`<h3>${id?'Editar':'Novo'} cliente</h3><label>Nome completo</label><input id="f_nome" value="${esc(c.nome)}"><div class="row"><div><label>CPF</label><input id="f_cpf" value="${esc(c.cpf)}" oninput="this.value=mCPF(this.value)"></div><div><label>Telefone/WhatsApp</label><input id="f_tel" value="${esc(c.tel)}" oninput="this.value=mTel(this.value)"></div></div>
 <label>Endereço</label><input id="f_end" value="${esc(c.end)}"><div class="row"><div><label>Limite (R$)</label><input id="f_lim" type="number" step="0.01" value="${c.limite}"></div><div><label>Dia de vencimento</label><input id="f_venc" type="number" min="1" max="28" value="${c.venc}"></div><div><label>Juros/multa por atraso (%)</label><input id="f_jur" type="number" step="0.1" value="${c.juros}"></div></div>
 <label>Forma de pagamento preferida</label><select id="f_forma">${['Dinheiro','Pix','Cartão','Transferência'].map(f=>`<option ${f==c.forma?'selected':''}>${f}</option>`)}</select>
 <label>Observações internas (uso exclusivo da loja — NUNCA saem nos PDFs)</label><textarea id="f_obs" rows="2">${esc(c.obs)}</textarea>
 <button class="b ok" onclick="salvaCli('${id||''}')">Salvar</button><button class="b s" onclick="X()">Cancelar</button>`)}
async function salvaCli(id){const nome=$('#f_nome').value.trim(),cpf=$('#f_cpf').value;if(!nome)return alert('Informe o nome.');if(!okCPF(cpf))return alert('CPF inválido.');
 if(D.cli.some(c=>dig(c.cpf)==dig(cpf)&&c.id!==id))return alert('CPF já cadastrado.');
 let c=id?cli(id):{id:'C'+String(Math.max(0,...D.cli.map(x=>+x.id.slice(1)||0))+1).padStart(5,'0'),criado:today(),aplicaJuros:true};
 Object.assign(c,{nome,cpf,tel:$('#f_tel').value,end:$('#f_end').value,limite:+$('#f_lim').value||0,venc:+$('#f_venc').value||10,juros:+$('#f_jur').value||0,forma:$('#f_forma').value,obs:$('#f_obs').value});
 await put('clientes',c);await load();X();if(id)verCli(id);else{cartao(c.id)}}
async function delCli(id){if(!confirm('Excluir cliente e todo o histórico?'))return;for(const i of itensC(id))await del('itens',i.id);await del('clientes',id);await log('Cliente excluído '+id);await load();go('cli')}
function verCli(id){V.cid=id;V.di=V.df='';V.st='Todos';tab='cli';go('cli');fichaCli()}
function fichaCli(){const id=V.cid,c=cli(id),s=saldo(id),usado=Math.max(0,s),pc=c.limite?Math.min(100,usado/c.limite*100):0;

 $('#main').innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">${esc(c.nome)} ${badge(id)}</h2></div><small class="mu">${c.id} · ${esc(c.cpf)} · ${esc(c.tel)} · Venc. dia ${c.venc}</small><p style="margin:8px 0 3px">Limite ${R(c.limite)} · Utilizado ${R(usado)} · Disponível ${R(c.limite-usado)}</p><div class="bar"><i style="width:${pc}%;background:${pc>90?'var(--er)':'var(--pr)'}"></i></div>

const nh=h=>String(h??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const HM={codigobarras:'barras',codbarras:'barras',ean:'barras',gtin:'barras',gtinean:'barras',codigo:'sku',codnofornecedor:'codforn',categoriadoproduto:'categoria',grupodeprodutos:'grupo2',situacao:'situacao',nomeproduto:'nome',nome:'nome',produto:'nome',descricao:'nome',precovenda:'preco',preco:'preco',valor:'preco',categoria:'categoria',grupo:'categoria',unidade:'unidade',un:'unidade',und:'unidade',fornecedor:'fornecedor',codigointerno:'ref',referencia:'ref',ref:'ref'};
function pnum(v){if(typeof v=='number')return v;let s=String(v).replace(/[^\d.,-]/g,'');if(!s)return NaN;if(s.includes(',')&&s.includes('.'))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');else if(s.includes(','))s=s.replace(',','.');return parseFloat(s)}
async function impXls(f){if(!f)return;let rows;
 try{if(/\.(csv|txt)$/i.test(f.name))rows=parseCSV(await f.text());else{const wb=XLSX.read(await f.arrayBuffer());rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''})}}catch(e){return alert('Não consegui ler o arquivo.')}
 rows=rows.map(r=>r.map(v=>typeof v=='number'?v:String(v??'').replace(/\u00a0/g,' ').trim()));
 const hi=rows.findIndex(r=>r.filter(c=>HM[nh(c)]).length>=2);if(hi<0)return alert('Não encontrei o cabeçalho (colunas de nome/descrição e preço).');
 const col={};rows[hi].forEach((h,i)=>{const k=HM[nh(h)];if(k&&col[k]===undefined)col[k]=i});if(col.nome===undefined||col.preco===undefined)return alert('O arquivo precisa ter colunas de nome/descrição e de preço.');
 let grupo='',n=0,u=0,ig=0;
 for(const r of rows.slice(hi+1)){const g=k=>col[k]===undefined?'':String(r[col[k]]??'').trim();let nome=g('nome');
  if(!nome){const ne=r.filter(c=>String(c)!=='');if(ne.length==1)grupo=String(ne[0]);continue}
  if(/inativ/i.test(g('situacao'))){ig++;continue}
  let ref=g('ref');const m=nome.match(/^(\d+)\s*-\s*(.+)$/);if(m){ref=ref||m[1];nome=m[2].trim()}ref=ref||g('sku')||g('codforn');nome=nome.replace(/\s*#+$/,'');
  const pr=pnum(r[col.preco]);if(isNaN(pr)){ig++;continue}
  const d={nome,preco:r2(pr),codigo:g('barras'),ref,unidade:g('unidade').toUpperCase(),categoria:g('categoria')||g('grupo2')||grupo,fornecedor:g('fornecedor')};
  const e=(d.codigo&&D.prod.find(p=>p.codigo==d.codigo))||(ref&&D.prod.find(p=>p.ref==ref&&(!d.fornecedor||!p.fornecedor||p.fornecedor==d.fornecedor)))||D.prod.find(p=>p.nome.toLowerCase()==nome.toLowerCase());
  if(e){Object.keys(d).forEach(k=>{if(d[k]!=='')e[k]=d[k]});await put('produtos',e);u++}else{const p={id:uid(),...d,unidade:d.unidade||'UN'};D.prod.push(p);await put('produtos',p);n++}}
 await load();VW.prod();alert(`Importação concluída: ${n} novos, ${u} atualizados${ig?`, ${ig} ignorados (sem preço válido)`:''}.`)}
/* ===== AGENDA E ALARMES ===== */
VW.agenda=()=>{const h=today(),L=D.cli.map(c=>{const a=abertos(c.id);if(!a.length)return null;const ds=a.map(i=>venc(i,c)).sort();return{c,prox:ds[0],at:maxAtraso(c.id),s:saldo(c.id)}}).filter(Boolean).sort((a,b)=>a.prox.localeCompare(b.prox));
 const t=(l)=>`<table>${l.map(x=>`<tr><td>${esc(x.c.nome)}</td><td>${dBR(x.prox)}${x.at>0?` <b style="color:var(--er)">(${x.at}d atraso)</b>`:''}</td><td class="r">${R(x.s)}</td><td><button class="b ok" onclick="wa('${x.c.id}','lembrete')">Cobrar</button></td></tr>`).join('')||'<tr><td class="mu">Nada.</td></tr>'}</table>`;
 $('#main').innerHTML=`<div class="card"><h3><i style="display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--er)"></i> Em atraso</h3>${t(L.filter(x=>x.at>0))}</div><div class="card"><h3><i style="display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--wn)"></i> Vencem hoje</h3>${t(L.filter(x=>x.prox==h&&x.at<=0))}</div><div class="card"><h3><i style="display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--ok)"></i> Próximos vencimentos</h3>${t(L.filter(x=>x.prox>h))}</div>
 <div class="card"><h3>Agendar alarme de cobrança</h3><div class="row"><select id="lc_c">${D.cli.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`)}</select><input id="lc_d" type="datetime-local"><input id="lc_m" placeholder="Observação"><button class="b" style="flex:0" onclick="addLem()">Agendar</button></div>
 <table>${D.lem.filter(l=>!l.done).sort((a,b)=>a.quando-b.quando).map(l=>`<tr><td>${new Date(l.quando).toLocaleString('pt-BR')}</td><td>${esc(cli(l.cid)?.nome)} ${esc(l.msg)}</td><td><button class="b er" onclick="delLem('${l.id}')">${ic('x')}</button></td></tr>`).join('')}</table></div>`};
async function addLem(){if(!$('#lc_d').value||!$('#lc_c').value)return alert('Escolha cliente e data/hora.');await put('lembretes',{id:uid(),cid:$('#lc_c').value,quando:new Date($('#lc_d').value).getTime(),msg:$('#lc_m').value,done:false});await load();VW.agenda()}
async function delLem(id){await del('lembretes',id);await load();VW.agenda()}
function alarme(l){const c=cli(l.cid);if(!c||$('#modal').style.display=='flex'&&V.alm)return;V.alm=1;[880,660,880].forEach((f,i)=>setTimeout(()=>beep(f,.25),i*350));
 M(`<h3>${ic('bell')} Hora de cobrar!</h3><p><b>${esc(c.nome)}</b> — saldo ${R(saldo(c.id))}<br>${esc(l.msg)}</p><button class="b ok" onclick="V.alm=0;fimLem('${l.id}');wa('${c.id}','lembrete')">Cobrar no WhatsApp</button><button class="b s" onclick="V.alm=0;sonec('${l.id}')">Adiar 10 min</button><button class="b" onclick="V.alm=0;fimLem('${l.id}');X()">OK</button>`)}
async function fimLem(id){const l=D.lem.find(x=>x.id==id);l.done=true;await put('lembretes',l);await load()}
async function sonec(id){const l=D.lem.find(x=>x.id==id);l.quando=Date.now()+6e5;await put('lembretes',l);await load();X()}
const tick=()=>{const l=D.lem.find(x=>!x.done&&x.quando<=Date.now());if(l&&!V.alm)alarme(l)};
/* ===== CONFIG / BACKUP ===== */
VW.cfg=()=>{const l=D.cfg;$('#main').innerHTML=`<div class="card"><h3>Identidade da loja</h3><div class="row"><input id="c_n" placeholder="Nome da loja" value="${esc(l.nome)}"><input id="c_d" placeholder="CNPJ/CPF" value="${esc(l.doc)}"><input id="c_t" placeholder="Telefone" value="${esc(l.tel)}"></div><label>Endereço</label><input id="c_e" value="${esc(l.end)}"><label>Logo</label><input type="file" id="c_l" accept="image/*">${l.logo?`<img src="${l.logo}" height="50">`:''}<br><button class="b ok" onclick="salvaCfg()">Salvar</button></div>
 <div class="card"><h3>Backup</h3><p class="mu">Último backup: ${l.lastBackup?new Date(l.lastBackup).toLocaleString('pt-BR'):'nunca'}</p><button class="b" onclick="backupExp()">${ic('down')} Exportar banco completo (.json)</button><label class="b" style="cursor:pointer;display:inline-block">${ic('up')} Restaurar backup<input type="file" hidden accept=".json" onchange="backupImp(this.files[0])"></label></div>`};
async function salvaCfg(){const f=$('#c_l').files[0];let logo=D.cfg.logo;if(f)logo=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
 await put('config',{...D.cfg,id:'loja',nome:$('#c_n').value,doc:$('#c_d').value,tel:$('#c_t').value,end:$('#c_e').value,logo});await load();VW.cfg();alert('Salvo!')}
async function backupExp(){const o={};for(const s of ST)o[s]=await getAll(s);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download=`backup-crediario-${today()}.json`;a.click();await put('config',{...D.cfg,id:'loja',lastBackup:Date.now()});await load();go(tab)}
async function backupImp(f){if(!f||!confirm('Isso SUBSTITUI todos os dados atuais pelo backup. Continuar?'))return;try{const o=JSON.parse(await f.text());for(const s of ST){await clr(s);for(const v of o[s]||[])await put(s,v)}await load();alert('Backup restaurado.');go('dash')}catch(e){alert('Arquivo inválido.')}}
/* ===== VERIFICAÇÃO DE SALVAMENTO ===== */
const AVISO='<h3>Atenção: seus dados podem não ficar salvos</h3><p>O navegador não está guardando os dados neste modo. Para o salvamento automático funcionar:</p><ol><li>Se estiver no <b>Google Sites</b> ou em outro site com o sistema embutido, o navegador bloqueia o salvamento. Publique o arquivo direto (ex.: GitHub Pages) ou abra do computador.</li><li>Baixe o arquivo <b>crediario_pro.html</b> e salve numa pasta do seu computador.</li><li>Abra com duplo clique no <b>Chrome</b> ou <b>Edge</b> (janela normal, não anônima), e não pela pré-visualização do chat.</li><li>Sempre abra o mesmo arquivo, no mesmo navegador.</li><li>Não limpe os dados do navegador e faça backup toda semana (Config).</li></ol><button class="b" onclick="X()">Entendi</button>';
async function checkStorage(){const el=$('#st');try{await put('config',{id:'_t',v:Date.now()});const r=await tx('config','readonly',o=>o.get('_t'));await del('config','_t');if(!r)throw 0;
 try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
 const emb=window.self!==window.top||['blob:','data:'].includes(location.protocol);el.className='bd '+(emb?'wn':'ok');el.textContent=emb?'Pré-visualização: dados podem sumir':'Salvando automaticamente';if(emb)M(AVISO)}
 catch(e){el.className='bd er';el.textContent='Sem salvamento!';M(AVISO)}}
/* ===== INÍCIO ===== */
(async()=>{try{document.body.dataset.t=localStorage.getItem('tema')||'light'}catch(e){}$('#logo').innerHTML=ic('card')+' Crediário Pro';$('#tbtn').innerHTML=ic('moon')+' Tema';try{await abrir()}catch(e){db=null;$('#main').innerHTML='';M(AVISO);$('#st').className='bd er';$('#st').textContent='Sem salvamento!';return}await load();go('dash');checkStorage();setInterval(tick,15000);
 const hj=D.cli.filter(c=>abertos(c.id).some(i=>venc(i,c)<=today()));if(hj.length){beep(660,.2);setTimeout(()=>M(`<h3>${ic('bell')} Vencimentos de hoje / em atraso</h3><table>${hj.map(c=>`<tr><td>${esc(c.nome)}</td><td class="r">${R(saldo(c.id))}</td><td><button class="b ok" onclick="wa('${c.id}','lembrete')">Cobrar</button></td></tr>`).join('')}</table><button class="b s" onclick="X()">Fechar</button>`),400)}})();
</script></body></html>
